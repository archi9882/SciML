<meta charset="utf-8">
<title>SciML 半年學習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: field logbook. Sticky gauge bar; left rail lists 26 weeks by phase; main column shows either the home map or one week (control heatmap, daily tasks, lesson with animations, reading, notes). */
:root{
  --bg:#f3f6f7; --paper:#ffffff; --ink:#14232b; --muted:#5b6d76; --line:#d5dfe3;
  --sea:#0e5a73; --sea-soft:#dcebf0; --kelp:#2f7d5b; --kelp-soft:#ddefe5; --buoy:#d9822b; --buoy-soft:#fbead6;
  --miss:#b5452f; --miss-soft:#f8ddd5; --vio:#6b4fbb;
  --code-bg:#eef3f5; --code-ink:#1b2f38; --tok-kw:#8a3ffc; --tok-str:#2f7d5b; --tok-num:#b5452f; --tok-com:#6f838c; --tok-fn:#0e5a73;
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --paper:#14222a; --ink:#e3ecef; --muted:#93a6ae; --line:#26363e;
  --sea:#5fb3cf; --sea-soft:#173543; --kelp:#6cc49b; --kelp-soft:#173528; --buoy:#f0a65a; --buoy-soft:#3a2a17;
  --miss:#f0847a; --miss-soft:#3a2420; --vio:#b39cf0;
  --code-bg:#0f1c22; --code-ink:#d6e3e8; --tok-kw:#c4a7ff; --tok-str:#8fd6b0; --tok-num:#f3a291; --tok-com:#7d939b; --tok-fn:#7cc6de; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --paper:#14222a; --ink:#e3ecef; --muted:#93a6ae; --line:#26363e;
  --sea:#5fb3cf; --sea-soft:#173543; --kelp:#6cc49b; --kelp-soft:#173528; --buoy:#f0a65a; --buoy-soft:#3a2a17;
  --miss:#f0847a; --miss-soft:#3a2420; --vio:#b39cf0;
  --code-bg:#0f1c22; --code-ink:#d6e3e8; --tok-kw:#c4a7ff; --tok-str:#8fd6b0; --tok-num:#f3a291; --tok-com:#7d939b; --tok-fn:#7cc6de; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.3rem;font-weight:900}
h3{font-size:1.05rem;font-weight:600}
a{color:var(--sea)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--buoy);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-family:var(--font-mono)}
.app{max-width:1180px;margin:0 auto}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.bar .title{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.bar .title a{color:inherit;text-decoration:none}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--font-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.save{font-size:.72rem;font-family:var(--font-mono);color:var(--muted)}
.weeksel{display:none;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 8px}

/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:20px 72px}
.side{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;display:grid;gap:14px;padding-right:4px}
.side .ph{display:grid;gap:2px}
.side .ph-name{font-size:.72rem;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;padding:0 8px 2px}
.side a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:.86rem;padding:4px 8px;border-radius:5px;min-width:0}
.side a:hover{background:var(--paper)}
.side a[aria-current="page"]{background:var(--sea-soft);color:var(--sea);font-weight:500}
.side a .n{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);flex:0 0 26px}
.side a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side a .dot{flex:0 0 8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.side a .dot.half{background:var(--buoy-soft);border-color:var(--buoy)}
.side a .dot.full{background:var(--kelp);border-color:var(--kelp)}
.side a .now{font-size:.62rem;color:var(--buoy);font-family:var(--font-mono)}
.side .home-link{font-weight:500}
main{min-width:0;display:grid;gap:26px;align-content:start}
main > *,.card > *,.wk-head > *,.lesson > *,.lesson section > *,.day > *,.anim > *{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}.weeksel{display:block}}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px;min-width:0}
.today{border-left:4px solid var(--buoy)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.tag{display:inline-block;font-size:.7rem;font-family:var(--font-mono);padding:1px 8px;border-radius:999px;background:var(--sea-soft);color:var(--sea);margin:0 4px 4px 0}
.tag.classic{background:var(--buoy-soft);color:var(--buoy)}
.tag.ok{background:var(--kelp-soft);color:var(--kelp)}
.tag.doc{background:var(--kelp-soft);color:var(--kelp)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.86rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* checkboxes */
.chk{appearance:none;flex:0 0 20px;width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;margin-top:3px;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
.chk:checked{background:var(--kelp);border-color:var(--kelp)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-text{text-decoration:line-through;color:var(--muted)}
.task{display:flex;gap:10px;align-items:flex-start;min-width:0}
.task .kind{font-size:.7rem;font-family:var(--font-mono);color:var(--muted);display:block}

/* home map */
.map{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;align-items:end}
.map a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none}
.map .col{width:100%;height:56px;border-radius:3px;background:var(--sea-soft);position:relative;overflow:hidden}
.map .fill{position:absolute;left:0;right:0;bottom:0;background:var(--sea)}
.map .n{font-family:var(--font-mono);font-size:.6rem;color:var(--muted)}
.map a.cur .col{outline:2px solid var(--buoy);outline-offset:1px}
.map a.cur .n{color:var(--buoy);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(26,1fr);gap:3px}
.phases div{font-size:.62rem;color:var(--muted);border-top:2px solid var(--line);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.map,.phases{grid-template-columns:repeat(13,1fr)}.phases{display:none}.map .col{height:40px}}
.legend-phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;font-size:.82rem}
.legend-phases span b{font-family:var(--font-mono);color:var(--sea);margin-right:6px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-weight:500;color:var(--muted);font-size:.75rem;font-family:var(--font-mono)}
.tbl.wide table{min-width:620px}

/* week header */
.wk-head{display:grid;gap:6px}
.goal{max-width:68ch;margin:0}

/* heatmap */
.heat-grid{display:grid;grid-template-columns:48px repeat(6,1fr);gap:5px;min-width:0}
.heat-grid .hd{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);text-align:center}
.heat-grid .rl{font-size:.76rem;color:var(--muted);display:flex;align-items:center}
.hm{all:unset;cursor:pointer;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.66rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);min-width:0}
.hm.off{cursor:default;background:transparent;border-style:dashed;opacity:.5}
.hm.done{background:var(--kelp);border-color:var(--kelp);color:var(--paper)}
.hm.missed{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.hm.today{box-shadow:0 0 0 2px var(--buoy) inset;border-color:var(--buoy)}
.hm:hover:not(.off){border-color:var(--sea)}
.hm:focus-visible{outline:2px solid var(--buoy);outline-offset:1px}
.heat-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.heat-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.heat-legend i.done{background:var(--kelp);border-color:var(--kelp)}
.heat-legend i.missed{background:var(--miss-soft);border-color:var(--miss)}
.heat-legend i.today{box-shadow:0 0 0 2px var(--buoy) inset}

/* day tasks */
.days{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.day{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) auto;gap:10px 14px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day.is-today{background:var(--buoy-soft)}
.day .when{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);line-height:1.4}
.day .when b{display:block;color:var(--ink);font-size:.84rem}
.day .go{font-size:.76rem;white-space:nowrap}
@media (max-width:700px){.day{grid-template-columns:minmax(0,1fr)}}

/* lesson prose */
.lesson{display:grid;gap:22px}
.lesson section{display:grid;gap:12px;scroll-margin-top:96px}
.lesson h2{font-size:1.25rem}
.lesson h3{font-size:1.02rem;margin-top:4px}
.lesson p,.lesson li{max-width:70ch}
.lesson p{margin:0}
.lesson ul,.lesson ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.lesson .eq{font-family:var(--font-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:pre;font-size:.86rem}
.lesson code:not(pre code){font-family:var(--font-mono);font-size:.86em;background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:4px}
.callout{border-radius:6px;padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--bg)}
.callout > b:first-child{font-size:.78rem;font-family:var(--font-mono);letter-spacing:.04em}
.callout.term{border-left:4px solid var(--sea)}
.callout.term > b:first-child{color:var(--sea)}
.callout.predict{border-left:4px solid var(--buoy)}
.callout.predict > b:first-child{color:var(--buoy)}
.callout.trap{border-left:4px solid var(--miss)}
.callout.trap > b:first-child{color:var(--miss)}
.callout.job{border-left:4px solid var(--kelp)}
.callout.job > b:first-child{color:var(--kelp)}
.day-mark{font-family:var(--font-mono);font-size:.72rem;color:var(--paper);background:var(--sea);border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:2px}

/* code */
.code{position:relative;min-width:0}
.code pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:14px 16px;overflow-x:auto;font-size:.82rem;line-height:1.6}
.code pre code{font-family:var(--font-mono);background:none;padding:0}
.code .file{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.code .cp{position:absolute;top:26px;right:8px;font-size:.7rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--muted)}
.code .cp:hover{color:var(--sea);border-color:var(--sea)}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--tok-kw)}
.hljs-string{color:var(--tok-str)}
.hljs-number{color:var(--tok-num)}
.hljs-comment{color:var(--tok-com);font-style:italic}
.hljs-title,.hljs-title.function_{color:var(--tok-fn)}
.hljs-meta,.hljs-attr{color:var(--tok-fn)}

/* animations */
.anim{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:14px;display:grid;gap:10px;min-width:0}
.anim .a-title{font-weight:700;font-size:.92rem}
.anim .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.84rem}
.anim .ctl label{display:inline-flex;gap:6px;align-items:center}
.anim input[type=range]{accent-color:var(--sea);width:160px;max-width:100%}
.anim input[type=checkbox]{accent-color:var(--sea)}
.anim .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.anim .seg button{border:0;background:var(--paper);padding:4px 10px;cursor:pointer;font-size:.8rem}
.anim .seg button[aria-pressed="true"]{background:var(--sea);color:var(--paper)}
.anim .read{font-size:.84rem;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 18px}
.anim .read .bad{color:var(--miss)}
.anim .read .good{color:var(--kelp)}
.anim .cap{font-size:.84rem;color:var(--muted)}
.anim .plots{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.anim .plots > div{flex:1 1 300px;min-width:0}
.anim .plots > .phasor{flex:0 0 170px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.job{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--font-mono);font-size:.72rem;display:grid;gap:2px;transition:background .25s,border-color .25s}
.job .st{font-size:.68rem;color:var(--muted)}
.job.run{border-color:var(--buoy);background:var(--buoy-soft)}
.job.ok{border-color:var(--kelp);background:var(--kelp-soft)}
.job.skip{border-style:dashed;opacity:.65}
.job.fail{border-color:var(--miss);background:var(--miss-soft)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe .stage{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:4px;align-content:start;min-width:0;transition:opacity .3s,border-color .3s}
.pipe .stage.dim{opacity:.3}
.pipe .stage.on{border-color:var(--sea)}
.pipe .cmd{font-family:var(--font-mono);font-size:.72rem;color:var(--sea);overflow-wrap:anywhere}
.pipe .ln{font-family:var(--font-mono);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.pipe{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* notes */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.notes{grid-template-columns:1fr}}
.notes label{display:grid;gap:6px;font-size:.84rem;font-weight:500}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:10px;line-height:1.6}
@media (prefers-reduced-motion:no-preference){.map .fill{transition:height .3s ease}}
.sources summary{cursor:pointer;list-style-position:outside}
.sources[open] summary{margin-bottom:4px}
.src-list{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.84rem;list-style:none}
.src-list li{overflow-wrap:anywhere}
.src-list .src-ph{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}
/* 單元連動圖 */
.dep,.sources{display:block}
.dep summary,.sources summary{cursor:pointer}
.dep-body{display:grid;gap:12px;min-width:0;margin-top:12px}
.dep-body > *{min-width:0}
.dep-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.dep-svg{display:block;min-width:960px;width:100%;height:auto}
.dep-edge{fill:none;stroke-width:1.8;opacity:.75;transition:opacity .2s,stroke-width .2s}
.dep-svg.focus .dep-edge{opacity:.1}
.dep-svg.focus .dep-edge.on{opacity:1;stroke-width:3}
.dep-node{cursor:pointer}
.dep-node circle{stroke-width:2;transition:opacity .2s}
.dep-node text{font-family:var(--font-mono);font-size:10px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dep-node.cat-start circle{fill:var(--paper);stroke:var(--sea)}
.dep-node.cat-start text{fill:var(--sea)}
.dep-node.cat-linked circle{fill:var(--sea);stroke:var(--sea)}
.dep-node.cat-linked text{fill:var(--paper)}
.dep-node.cat-solo circle{fill:var(--paper);stroke:var(--muted);stroke-dasharray:3 2}
.dep-node.cat-solo text{fill:var(--muted)}
.dep-node.cat-sum circle{fill:var(--buoy-soft);stroke:var(--buoy);stroke-width:3}
.dep-node.cat-sum text{fill:var(--buoy)}
.dep-svg.focus .dep-node circle{opacity:.3}
.dep-svg.focus .dep-node.on circle{opacity:1}
.dep-node:focus,.dep-node:focus-visible{outline:none}
.dep-node:focus-visible circle{stroke:var(--buoy);stroke-width:3}
.dep-ph{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.dep-band{fill:var(--sea-soft);opacity:.5}
.dep-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);align-items:center}
.dep-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px;border:2px solid var(--sea)}
.dep-legend i.linked{background:var(--sea)}
.dep-legend i.solo{border:2px dashed var(--muted)}
.dep-legend i.sum{background:var(--buoy-soft);border:3px solid var(--buoy)}
.dep-legend b{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.dep-info{font-size:.86rem;min-height:2.6em;margin:0}
</style>

<div class="app">
  <header class="bar">
    <div class="title">
      <h1><a href="#home">SciML 半年學習站</a></h1>
      <span class="muted" style="font-size:.82rem">數值模擬・空間資訊・資料工程・自有基礎建設・MLOps｜每天 60–90 分鐘</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="st-pct">0%</b><span>總進度</span></div>
      <div class="stat"><b id="st-week">0%</b><span>本週</span></div>
      <div class="stat"><b id="st-streak">0</b><span>連續天數</span></div>
    </div>
    <span class="save" id="save-state">本機儲存</span>
    <select class="weeksel" id="weeksel" aria-label="選擇週次"></select>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="週次"></nav>
    <main id="main" aria-live="polite"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
// ======================= 課程資料 =======================
const PHASES=[
 {id:"A",name:"A 打底",from:1,to:2},
 {id:"B",name:"B 數值方法與物理判斷",from:3,to:7},
 {id:"B2",name:"B2 神經網路與 hybrid",from:8,to:9},
 {id:"C",name:"C 空間資訊與地理統計",from:10,to:11},

function canvas(host,h){const c=document.createElement("canvas");c.style.cssText=`width:100%;height:${h}px;display:block`;host.appendChild(c);
  const ctx=c.getContext("2d");return{c,ctx,size(){const w=Math.max(10,c.getBoundingClientRect().width||host.clientWidth||300),dpr=window.devicePixelRatio||1;
    if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{w,h}}}}
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const[a,v]of Object.entries(attrs))e.setAttribute(a,v);if(html!==undefined)e.innerHTML=html;return e}
function frame(ctx,box,o){// o: x0,x1,y0,y1,xt,yt,xl,yl,pad
  const L=o.padL??42,Rp=o.padR??10,T=o.padT??12,B=o.padB??26,cl=C();
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(box.w-L-Rp),Y=y=>T+(o.y1-y)/(o.y1-o.y0)*(box.h-T-B);
  ctx.strokeStyle=cl.line;ctx.lineWidth=1;ctx.fillStyle=cl.muted;ctx.font=`11px ${cl.mono||"monospace"}`;
  (o.yt||[]).forEach(v=>{ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(L,Y(v));ctx.lineTo(box.w-Rp,Y(v));ctx.stroke();ctx.globalAlpha=1;ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(String(v),L-6,Y(v))});
  (o.xt||[]).forEach(v=>{ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(String(v),X(v),box.h-B+6)});
  ctx.textAlign="left";ctx.textBaseline="top";if(o.yl)ctx.fillText(o.yl,L+4,T);if(o.xl){ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillText(o.xl,box.w-Rp,box.h-B-4)}

function line(ctx,pts,color,w,dash){ctx.strokeStyle=color;ctx.lineWidth=w||1.5;ctx.setLineDash(dash||[]);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([])}
function dotAt(ctx,x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function mulberry(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(rand){let u=0,v=0;while(u===0)u=rand();while(v===0)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function observe(host,draw){redraws.add(draw);const ro=new ResizeObserver(()=>draw());ro.observe(host);return()=>{redraws.delete(draw);ro.disconnect()}}
const TM2=12.42,TS2=12.00,TBEAT=1/Math.abs(1/TM2-1/TS2)/24;

const ANIMS={
 // 1. M2 + S2 疊加 → 大小潮（時間序列＋相量圖）
 "tide-beat"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"M2 與 S2 疊加：大潮與小潮從哪裡來"));
  const ctl=el("div",{class:"ctl"},`<label>S2 振幅 <input type="range" id="tb-s2" min="0" max="1" step="0.05" value="0.45"> <span class="mono" id="tb-s2v">0.45</span> m</label>
   <label>時間 <input type="range" id="tb-t" min="0" max="30" step="0.05" value="0"> <span class="mono" id="tb-tv">0.0</span> 天</label>
   <button class="btn" id="tb-play" type="button">播放</button>`);
  const plots=el("div",{class:"plots"});const p1=el("div"),p2=el("div",{class:"phasor"});plots.append(p1,p2);
  const read=el("div",{class:"read"});const cap=el("p",{class:"cap"},"右圖以 M2 為基準（固定朝右），S2 的箭頭每 14.79 天相對轉一圈。兩箭頭同向時合成最長＝大潮；反向時最短＝小潮。M2 固定為 1.00 m。");
  host.append(ctl,plots,read,cap);
  const A=1.0;let B=.45,tau=0,playing=false,raf=0,last=0;
  const cv1=canvas(p1,230),cv2=canvas(p2,170);
  const s2=ctl.querySelector("#tb-s2"),tt=ctl.querySelector("#tb-t"),pb=ctl.querySelector("#tb-play");
  function env(tday){const dphi=2*Math.PI*(tday*24)*(1/TS2-1/TM2);return Math.sqrt(A*A+B*B+2*A*B*Math.cos(dphi))}
  function draw(){const cl=C(),b=cv1.size(),ctx=cv1.ctx;const yr=1.25+0.2;
    const f=frame(ctx,b,{x0:0,x1:30,y0:-2.2,y1:2.6,xt:[0,5,10,15,20,25,30],yt:[-2,-1,0,1,2],yl:"水位 [m]",xl:"天"});
    // 大小潮標記
    for(let kk=0;kk*TBEAT<=30;kk++){[[kk*TBEAT,"大潮",cl.kelp],[(kk+.5)*TBEAT,"小潮",cl.buoy]].forEach(([x,lab,col])=>{if(x>30)return;ctx.fillStyle=col;ctx.globalAlpha=.12;ctx.fillRect(f.X(x)-6,f.T,12,f.B-f.T);ctx.globalAlpha=1;ctx.font="11px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(lab,f.X(x),f.T)})}
    const pts=[],up=[],dn=[];for(let i=0;i<=30*24*2;i++){const th=i/2,td=th/24;const v=A*Math.cos(2*Math.PI*th/TM2)+B*Math.cos(2*Math.PI*th/TS2);pts.push([f.X(td),f.Y(v)]);const e=env(td);up.push([f.X(td),f.Y(e)]);dn.push([f.X(td),f.Y(-e)])}

    ctx.strokeStyle=cl.ink;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(f.X(tau),f.T+14);ctx.lineTo(f.X(tau),f.B);ctx.stroke();
    // 相量
    const b2=cv2.size(),c2=cv2.ctx,cx=b2.w/2,cy=b2.h/2,sc=Math.min(b2.w,b2.h)/2/ (A+1)*0.95;
    c2.strokeStyle=cl.line;c2.beginPath();c2.arc(cx,cy,sc*(A+B),0,Math.PI*2);c2.stroke();c2.setLineDash([3,3]);c2.beginPath();c2.arc(cx,cy,sc*Math.abs(A-B),0,Math.PI*2);c2.stroke();c2.setLineDash([]);
    const dphi=2*Math.PI*(tau*24)*(1/TS2-1/TM2);const ax=cx+sc*A,ay=cy,bx=ax+sc*B*Math.cos(dphi),by=ay-sc*B*Math.sin(dphi);

    arrow(cx,cy,ax,ay,cl.sea,2.5);if(B>0)arrow(ax,ay,bx,by,cl.muted,2);arrow(cx,cy,bx,by,cl.buoy,2);
    c2.fillStyle=cl.muted;c2.font="11px sans-serif";c2.textAlign="left";c2.textBaseline="top";c2.fillText("M2",cx+4,cy+4);c2.fillStyle=cl.buoy;c2.fillText("合成",4,4);
    const L=env(tau),deg=((dphi*180/Math.PI)%360+360)%360;
    read.innerHTML=`<span>大潮潮差 2(M2+S2) = <b>${(2*(A+B)).toFixed(2)}</b> m</span><span>小潮潮差 2|M2−S2| = <b>${(2*Math.abs(A-B)).toFixed(2)}</b> m</span><span>週期 ${TBEAT.toFixed(2)} 天</span><span>此刻夾角 ${deg.toFixed(0)}°，當日潮差 ≈ <b>${(2*L).toFixed(2)}</b> m</span>`}
  function step(ts){if(!playing)return;const dt=last?(ts-last)/1000:0;last=ts;tau=(tau+dt*2.5)%30;tt.value=tau;ctl.querySelector("#tb-tv").textContent=tau.toFixed(1);draw();raf=requestAnimationFrame(step)}

 // 2. 取樣頻率改了，t 的單位就變了
 "sampling-units"(host){host.innerHTML="";

 // 3. seed 只影響雜訊
 "seed-noise"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"改 seed：哪些會變、哪些不會"));
  const ctl=el("div",{class:"ctl"},`<span>SEED = <b class="mono" id="sn-v">42</b></span><button class="btn" type="button" id="sn-new">換一個 seed</button><button class="btn" type="button" id="sn-same">同一個 seed 再跑一次</button>`);
  const box=el("div"),cap=el("p",{class:"cap"},"雜訊放大為 0.15 m 方便觀察。分潮由公式算出，跟 seed 無關；雜訊由亂數產生器產生，seed 決定這串亂數。");
  host.append(ctl,box,cap);const cv=canvas(box,300);let seed=42,prev=null,flash=null,fadeT=0,raf=0;

  function draw(){const cl=C(),b=cv.size(),ctx=cv.ctx,h=b.h/3;
    const eta=det.map((v,i)=>v+cur[i]),pe=prev?det.map((v,i)=>v+prev[i]):null;

 // 4. resample 分組統計
 "resample"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"resample(\"D\")：每小時 → 每日"));
  const ctl=el("div",{class:"ctl"},`<button class="btn" type="button" id="rs-prev">上一步</button><button class="btn" type="button" id="rs-next">下一步</button><button class="btn" type="button" id="rs-play">自動播放</button><span class="mono" id="rs-step"></span>`);
  const box=el("div"),cap=el("p",{class:"cap"});host.append(ctl,box,cap);const cv=canvas(box,220);
  const N=72,r=mulberry(7),v=[];for(let i=0;i<N;i++)v.push(.2+Math.cos(2*Math.PI*i/TM2)+.45*Math.cos(2*Math.PI*i/TS2)+.05*gauss(r));
  const days=[0,1,2].map(d=>{const s=v.slice(d*24,d*24+24);const mx=Math.max(...s),mn=Math.min(...s);return{mx,mn,mean:s.reduce((a,b)=>a+b,0)/24,imx:d*24+s.indexOf(mx),imn:d*24+s.indexOf(mn)}});
  const CAP=["原始資料：72 筆每小時潮位，索引是時間。",'<code>eta.resample("D")</code>：依「日期」把資料分成 3 組，每組 24 筆。','<code>.agg(["max", "min", "mean"])</code>：每組算最高、最低、平均，3 天變成 3 列。','<code>daily["range"] = daily["max"] - daily["min"]</code>：每日潮差，就是第 1 週的第二張圖。'];
  let stp=0,timer=0;
  function draw(){const cl=C(),b=cv.size(),ctx=cv.ctx;const f=frame(ctx,b,{x0:0,x1:72,y0:-1.6,y1:1.9,xt:[0,24,48,72],yt:[-1,0,1],yl:"水位 [m]",xl:"小時"});
    if(stp>=1)[0,1,2].forEach(d=>{ctx.fillStyle=d%2?cl.seaSoft:cl.bg;ctx.globalAlpha=.7;ctx.fillRect(f.X(d*24),f.T,f.X(24)-f.X(0),f.B-f.T);ctx.globalAlpha=1;ctx.fillStyle=cl.muted;ctx.font="11px sans-serif";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(`第 ${d+1} 天`,f.X(d*24+12),f.T+2)});
    const a=stp>=3?.18:1;ctx.globalAlpha=a;v.forEach((y,i)=>dotAt(ctx,f.X(i+.5),f.Y(y),2.2,cl.sea));line(ctx,v.map((y,i)=>[f.X(i+.5),f.Y(y)]),cl.sea,.8);ctx.globalAlpha=1;
    if(stp>=2)days.forEach((d,j)=>{const x0=f.X(j*24+1),x1=f.X(j*24+23);line(ctx,[[x0,f.Y(d.mean)],[x1,f.Y(d.mean)]],cl.muted,1.4,[4,3]);dotAt(ctx,f.X(d.imx+.5),f.Y(d.mx),5,cl.miss);dotAt(ctx,f.X(d.imn+.5),f.Y(d.mn),5,cl.kelp);
      ctx.font="11px "+cl.mono;ctx.fillStyle=cl.ink;ctx.textAlign="left";ctx.textBaseline="bottom";ctx.fillText(`max ${d.mx.toFixed(2)}`,f.X(j*24+1),f.Y(1.75));ctx.textBaseline="top";ctx.fillText(`min ${d.mn.toFixed(2)}`,f.X(j*24+1),f.Y(-1.25))});
    if(stp>=3)days.forEach((d,j)=>{const x=f.X(j*24+12);ctx.strokeStyle=cl.buoy;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,f.Y(d.mx));ctx.lineTo(x,f.Y(d.mn));ctx.stroke();ctx.fillStyle=cl.buoy;ctx.font="bold 12px "+cl.mono;ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(`range ${(d.mx-d.mn).toFixed(2)}`,x+8,f.Y((d.mx+d.mn)/2))});
    cap.innerHTML=CAP[stp];ctl.querySelector("#rs-step").textContent=`${stp+1} / 4`}
  const go=s=>{stp=(s+4)%4;draw()};
  ctl.querySelector("#rs-prev").addEventListener("click",()=>{clearInterval(timer);go(stp-1)});
  ctl.querySelector("#rs-next").addEventListener("click",()=>{clearInterval(timer);go(stp+1)});
  ctl.querySelector("#rs-play").addEventListener("click",()=>{clearInterval(timer);go(0);timer=setInterval(()=>go(stp+1),1800)});
  const off=observe(host,draw);draw();return()=>{clearInterval(timer);off()}},

 // 5. 找高潮：雜訊造成假峰值
 "peak-find"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"「比前後都高」就是高潮嗎：雜訊造成的假峰值"));
  const ctl=el("div",{class:"ctl"},`<label>雜訊 NOISE_STD <input type="range" id="pf-n" min="0" max="0.4" step="0.01" value="0.05"> <span class="mono" id="pf-nv">0.05</span> m</label>
   <label><input type="checkbox" id="pf-gap"> 最小間隔 6 小時</label><label><input type="checkbox" id="pf-sm"> 先平滑（5 點移動平均）</label><button class="btn" type="button" id="pf-re">新雜訊</button>`);
  const box=el("div"),read=el("div",{class:"read"}),cap=el("p",{class:"cap"},"紅點是演算法找到的高潮；淺色圈是沒有雜訊時真正的高潮位置。三天的半日潮應該約有 6 次高潮（24 ÷ 12.42 ≈ 1.93 次／天）。");
  host.append(ctl,box,read,cap);const cv=canvas(box,220);let ns=.05,gap=false,sm=false,seed=3;
  const N=72,det=[];for(let i=0;i<N;i++)det.push(.2+Math.cos(2*Math.PI*i/TM2)+.45*Math.cos(2*Math.PI*i/TS2));
  const peaks=a=>{const p=[];for(let i=1;i<a.length-1;i++)if(a[i]>a[i-1]&&a[i]>a[i+1])p.push(i);return p};
  function draw(){const cl=C(),b=cv.size(),ctx=cv.ctx;const r=mulberry(seed);const raw=det.map(v=>v+ns*gauss(r));
    let s=raw;if(sm)s=raw.map((_,i)=>{let a=0,c=0;for(let j=i-2;j<=i+2;j++)if(j>=0&&j<N){a+=raw[j];c++}return a/c});
    let p=peaks(s);if(gap){const sorted=[...p].sort((a,b)=>s[b]-s[a]),keep=[];sorted.forEach(i=>{if(keep.every(j=>Math.abs(j-i)>=6))keep.push(i)});p=keep.sort((a,b)=>a-b)}
    const f=frame(ctx,b,{x0:0,x1:71,y0:-1.8,y1:2.1,xt:[0,12,24,36,48,60,72].filter(x=>x<=71),yt:[-1,0,1,2],yl:"水位 [m]",xl:"小時"});
    peaks(det).forEach(i=>{ctx.strokeStyle=cl.kelp;ctx.lineWidth=2;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(f.X(i),f.Y(det[i]),8,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1});
    line(ctx,raw.map((v,i)=>[f.X(i),f.Y(v)]),cl.sea,1);if(sm)line(ctx,s.map((v,i)=>[f.X(i),f.Y(v)]),cl.ink,1.6);
    p.forEach(i=>dotAt(ctx,f.X(i),f.Y(s[i]),4,cl.miss));
    const ok=p.length>=5&&p.length<=7;read.innerHTML=`<span class="${ok?"good":"bad"}">找到 ${p.length} 個高潮（預期約 6 個）</span>${ok?"":"<span>多出來的是雜訊造成的假峰值</span>"}`}
  ctl.querySelector("#pf-n").addEventListener("input",e=>{ns=+e.target.value;ctl.querySelector("#pf-nv").textContent=ns.toFixed(2);draw()});
  ctl.querySelector("#pf-gap").addEventListener("change",e=>{gap=e.target.checked;draw()});
  ctl.querySelector("#pf-sm").addEventListener("change",e=>{sm=e.target.checked;draw()});
  ctl.querySelector("#pf-re").addEventListener("click",()=>{seed++;draw()});
  const off=observe(host,draw);draw();return off},

 // 6. 批次工作流程（第 2 週）
 "batch-flow"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"批次的四個步驟：送出 → 結束碼 → 跳過已完成 → 彙整"));
  const ctl=el("div",{class:"ctl"},`<button class="btn primary" type="button" id="bf-run">執行 batch.py</button><button class="btn" type="button" id="bf-reset">清空 runs/</button><label><input type="checkbox" id="bf-bad"> 加入錯誤參數 s2_amp = -1</label>`);
  const jobs=el("div",{class:"jobs"}),read=el("div",{class:"read"}),tbl=el("div",{class:"tbl"}),cap=el("p",{class:"cap"},"每個方塊是一個「工作」＝一次 tide_cli.py 執行。表格的 min_range_m 是範例程式實際跑出來的值。");
  host.append(ctl,jobs,read,tbl,cap);
  const grid=[];[.2,.45,.7,.9,1.0].forEach(a=>[1,2].forEach(s=>grid.push({a,s})));let done=new Set(),timers=[],busy=false;
  const name=j=>`s2_amp${j.a}_seed${j.s}`;
  function list(){const g=[...grid];if(ctl.querySelector("#bf-bad").checked)g.push({a:-1,s:1});return g}
  function paint(states){const g=list();jobs.innerHTML=g.map((j,i)=>{const st=states?states[i]:(done.has(name(j))?"ok":"");const lab={"":"尚未執行",run:"執行中…",ok:"exit 0・完成",skip:"跳過（已完成）",fail:"exit 2・參數錯誤"}[st];
    return `<div class="job ${st}"><span>${name(j)}</span><span class="st">${lab}</span></div>`}).join("")}
  const REAL={"s2_amp0.2_seed1":1.5757,"s2_amp0.2_seed2":1.6282,"s2_amp0.45_seed1":1.1183,"s2_amp0.45_seed2":1.155,"s2_amp0.7_seed1":.6518,"s2_amp0.7_seed2":.6952,"s2_amp0.9_seed1":.3769,"s2_amp0.9_seed2":.4029,"s2_amp1_seed1":.3435,"s2_amp1_seed2":.3396};
  function table(){const rows=grid.filter(j=>done.has(name(j))).map(j=>`<tr><td class="mono">${name(j)}</td><td class="mono">${j.a}</td><td class="mono">${j.s}</td><td class="mono">${REAL[name(j)].toFixed(4)}</td><td class="mono">${(2*Math.abs(1-j.a)).toFixed(2)}</td></tr>`).join("");
    tbl.innerHTML=rows?`<table><thead><tr><th>run</th><th>s2_amp</th><th>seed</th><th>min_range_m</th><th>theory_min</th></tr></thead><tbody>${rows}</tbody></table>`:`<p class="muted" style="margin:0;padding:10px">summary.csv 還是空的</p>`}
  function run(){if(busy)return;busy=true;const g=list(),states=g.map(()=>"");let nRun=0,nSkip=0,nFail=0;
    g.forEach((j,i)=>{timers.push(setTimeout(()=>{if(done.has(name(j))){states[i]="skip";nSkip++;paint(states)}else{states[i]="run";paint(states);
        timers.push(setTimeout(()=>{if(j.a<0){states[i]="fail";nFail++}else{states[i]="ok";done.add(name(j));nRun++}paint(states);table()},RM.matches?0:260))}
      if(i===g.length-1)timers.push(setTimeout(()=>{busy=false;read.innerHTML=`<span>執行 ${nRun}</span><span>跳過 ${nSkip}</span><span class="${nFail?"bad":"good"}">失敗 ${nFail}</span><span>batch.py 結束碼：${nFail?1:0}</span>`},RM.matches?0:400))},RM.matches?0:i*300))})}
  ctl.querySelector("#bf-run").addEventListener("click",run);
  ctl.querySelector("#bf-reset").addEventListener("click",()=>{timers.forEach(clearTimeout);timers=[];busy=false;done.clear();paint();table();read.innerHTML=""});
  ctl.querySelector("#bf-bad").addEventListener("change",()=>{if(!busy)paint()});
  paint();table();return()=>timers.forEach(clearTimeout)},

 // 7. Linux 管線
 "pipe"(host){host.innerHTML="";
  host.append(el("div",{class:"a-title"},"管線 |：前一個指令的輸出，變成下一個指令的輸入"));

  const pipe=el("div",{class:"pipe"}),cap=el("p",{class:"cap"});host.append(ctl,pipe,cap);
  const runs=[];[.2,.45,.7,.9,1.0].forEach(a=>[1,2].forEach(s=>runs.push({a,s})));
  const catL=[];runs.slice(0,3).forEach(r=>{catL.push("{",`  "m2_amp": 1.0,`,`  "s2_amp": ${r.a},`,`  "seed": ${r.s},`,"  …","}")});catL.push(`…（10 個檔，共約 110 行）`);
  const grepL=runs.map(r=>`  "seed": ${r.s},`);const sortL=[...grepL].sort();const uniqL=[`  5   "seed": 1,`,`  5   "seed": 2,`];
  const ST=[["cat runs/*/config.json",catL,"cat：把 10 個檔案的內容接起來輸出。"],["grep seed",grepL,"grep：只留下含有 seed 的行，10 行。"],["sort",sortL,"sort：排序，相同的行會排在一起。"],["uniq -c",uniqL,"uniq -c：把連續相同的行合併並計數。答案：每個 seed 各 5 次。"]];
  let n=0;function paint(){pipe.innerHTML=ST.map((s,i)=>`<div class="stage ${i<n?"":"dim"} ${i===n-1?"on":""}"><span class="cmd">${i?"| ":""}${esc(s[0])}</span>${(i<n?s[1]:[]).map(x=>`<span class="ln">${esc(x)}</span>`).join("")}</div>`).join("");
    cap.textContent=n?ST[n-1][2]:"按「下一個指令」，看資料怎麼一步步被處理。";ctl.querySelector("#pp-next").disabled=n>=4}
  ctl.querySelector("#pp-next").addEventListener("click",()=>{n=Math.min(4,n+1);paint()});

const LINES={batch:{name:"批次與實驗線",col:"var(--buoy)",up:true},solver:{name:"物理與模型線",col:"var(--sea)",up:true},space:{name:"空間與服務線",col:"var(--kelp)",up:false},ops:{name:"資料與維運線",col:"var(--vio)",up:false},verify:{name:"AI 驗證線",col:"var(--miss)",up:false}};
const DEPS=[
 [1,2,"batch","潮位模型改成命令列工具"],[2,3,"batch","用批次結構掃描 Δx、Δt"],[2,4,"batch","批次結構變成實驗框架"],[4,8,"batch","用實驗框架產生訓練資料"],[4,20,"batch","批次實驗改用 MLflow 記錄"],[4,24,"batch","批次產生拓樸結構"],[24,25,"batch","用資料集訓練生成模型"],

function depCat(n){if(n===NW)return"sum";const i=DEPS.some(d=>d[1]===n),o=DEPS.some(d=>d[0]===n);return i?"linked":o?"start":"solo"}
function depMapHTML(){const gap=36,x0=26,y=175,X=n=>x0+(n-1)*gap,Wd=x0*2+(NW-1)*gap,H=360;
  let svg=`<svg class="dep-svg" id="dep-svg" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="26 週單元連動圖">`;
