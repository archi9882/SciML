<meta charset="utf-8">
<title>SciML 半年學習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: field logbook. Sticky gauge bar; left rail lists 26 weeks by phase; main column shows either the home map or one week (control heatmap, daily tasks, lesson with animations, reading, notes). */
:root{
  --bg:#f3f6f7; --paper:#ffffff; --ink:#14232b; --muted:#5b6d76; --line:#d5dfe3;
  --sea:#0e5a73; --sea-soft:#dcebf0; --kelp:#2f7d5b; --kelp-soft:#ddefe5; --buoy:#d9822b; --buoy-soft:#fbead6;
  --miss:#b5452f; --miss-soft:#f8ddd5; --vio:#6b4fbb;
  --code-bg:#eef3f5; --code-ink:#1b2f38; --tok-kw:#8a3ffc; --tok-str:#2f7d5b; --tok-num:#b5452f; --tok-com:#6f838c; --tok-fn:#0e5a73;
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --paper:#14222a; --ink:#e3ecef; --muted:#93a6ae; --line:#26363e;
  --sea:#5fb3cf; --sea-soft:#173543; --kelp:#6cc49b; --kelp-soft:#173528; --buoy:#f0a65a; --buoy-soft:#3a2a17;
  --miss:#f0847a; --miss-soft:#3a2420; --vio:#b39cf0;
  --code-bg:#0f1c22; --code-ink:#d6e3e8; --tok-kw:#c4a7ff; --tok-str:#8fd6b0; --tok-num:#f3a291; --tok-com:#7d939b; --tok-fn:#7cc6de; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --paper:#14222a; --ink:#e3ecef; --muted:#93a6ae; --line:#26363e;
  --sea:#5fb3cf; --sea-soft:#173543; --kelp:#6cc49b; --kelp-soft:#173528; --buoy:#f0a65a; --buoy-soft:#3a2a17;
  --miss:#f0847a; --miss-soft:#3a2420; --vio:#b39cf0;
  --code-bg:#0f1c22; --code-ink:#d6e3e8; --tok-kw:#c4a7ff; --tok-str:#8fd6b0; --tok-num:#f3a291; --tok-com:#7d939b; --tok-fn:#7cc6de; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.3rem;font-weight:900}
h3{font-size:1.05rem;font-weight:600}
a{color:var(--sea)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--buoy);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-family:var(--font-mono)}
.app{max-width:1180px;margin:0 auto}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.bar .title{display:flex;flex-direction:column;min-width:0;flex:1 1 240px}
.bar .title a{color:inherit;text-decoration:none}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--font-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.save{font-size:.72rem;font-family:var(--font-mono);color:var(--muted)}
.weeksel{display:none;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:6px 8px}

/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:20px 72px}
.side{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;display:grid;gap:14px;padding-right:4px}
.side .ph{display:grid;gap:2px}
.side .ph-name{font-size:.72rem;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;padding:0 8px 2px}
.side a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:.86rem;padding:4px 8px;border-radius:5px;min-width:0}
.side a:hover{background:var(--paper)}
.side a[aria-current="page"]{background:var(--sea-soft);color:var(--sea);font-weight:500}
.side a .n{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);flex:0 0 26px}
.side a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side a .dot{flex:0 0 8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.side a .dot.half{background:var(--buoy-soft);border-color:var(--buoy)}
.side a .dot.full{background:var(--kelp);border-color:var(--kelp)}
.side a .now{font-size:.62rem;color:var(--buoy);font-family:var(--font-mono)}
.side .home-link{font-weight:500}
main{min-width:0;display:grid;gap:26px;align-content:start}
main > *,.card > *,.wk-head > *,.lesson > *,.lesson section > *,.day > *,.anim > *{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}.weeksel{display:block}}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:12px;min-width:0}
.today{border-left:4px solid var(--buoy)}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.tag{display:inline-block;font-size:.7rem;font-family:var(--font-mono);padding:1px 8px;border-radius:999px;background:var(--sea-soft);color:var(--sea);margin:0 4px 4px 0}
.tag.classic{background:var(--buoy-soft);color:var(--buoy)}
.tag.ok{background:var(--kelp-soft);color:var(--kelp)}
.tag.doc{background:var(--kelp-soft);color:var(--kelp)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.86rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* checkboxes */
.chk{appearance:none;flex:0 0 20px;width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;margin-top:3px;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
.chk:checked{background:var(--kelp);border-color:var(--kelp)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-text{text-decoration:line-through;color:var(--muted)}
.task{display:flex;gap:10px;align-items:flex-start;min-width:0}
.task .kind{font-size:.7rem;font-family:var(--font-mono);color:var(--muted);display:block}

/* home map */
.map{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;align-items:end}
.map a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none}
.map .col{width:100%;height:56px;border-radius:3px;background:var(--sea-soft);position:relative;overflow:hidden}
.map .fill{position:absolute;left:0;right:0;bottom:0;background:var(--sea)}
.map .n{font-family:var(--font-mono);font-size:.6rem;color:var(--muted)}
.map a.cur .col{outline:2px solid var(--buoy);outline-offset:1px}
.map a.cur .n{color:var(--buoy);font-weight:600}
.phases{display:grid;grid-template-columns:repeat(26,1fr);gap:3px}
.phases div{font-size:.62rem;color:var(--muted);border-top:2px solid var(--line);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.map,.phases{grid-template-columns:repeat(13,1fr)}.phases{display:none}.map .col{height:40px}}
.legend-phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;font-size:.82rem}
.legend-phases span b{font-family:var(--font-mono);color:var(--sea);margin-right:6px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
th{border-top:0;font-weight:500;color:var(--muted);font-size:.75rem;font-family:var(--font-mono)}
.tbl.wide table{min-width:620px}

/* week header */
.wk-head{display:grid;gap:6px}
.goal{max-width:68ch;margin:0}

/* heatmap */
.heat-grid{display:grid;grid-template-columns:48px repeat(6,1fr);gap:5px;min-width:0}
.heat-grid .hd{font-family:var(--font-mono);font-size:.66rem;color:var(--muted);text-align:center}
.heat-grid .rl{font-size:.76rem;color:var(--muted);display:flex;align-items:center}
.hm{all:unset;cursor:pointer;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.66rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);min-width:0}
.hm.off{cursor:default;background:transparent;border-style:dashed;opacity:.5}
.hm.done{background:var(--kelp);border-color:var(--kelp);color:var(--paper)}
.hm.missed{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.hm.today{box-shadow:0 0 0 2px var(--buoy) inset;border-color:var(--buoy)}
.hm:hover:not(.off){border-color:var(--sea)}
.hm:focus-visible{outline:2px solid var(--buoy);outline-offset:1px}
.heat-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.heat-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.heat-legend i.done{background:var(--kelp);border-color:var(--kelp)}
.heat-legend i.missed{background:var(--miss-soft);border-color:var(--miss)}
.heat-legend i.today{box-shadow:0 0 0 2px var(--buoy) inset}

/* day tasks */
.days{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.day{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) auto;gap:10px 14px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.day:first-child{border-top:0}
.day.is-today{background:var(--buoy-soft)}
.day .when{font-family:var(--font-mono);font-size:.76rem;color:var(--muted);line-height:1.4}
.day .when b{display:block;color:var(--ink);font-size:.84rem}
.day .go{font-size:.76rem;white-space:nowrap}
@media (max-width:700px){.day{grid-template-columns:minmax(0,1fr)}}

/* lesson prose */
.lesson{display:grid;gap:22px}
.lesson section{display:grid;gap:12px;scroll-margin-top:96px}
.lesson h2{font-size:1.25rem}
.lesson h3{font-size:1.02rem;margin-top:4px}
.lesson p,.lesson li{max-width:70ch}
.lesson p{margin:0}
.lesson ul,.lesson ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.lesson .eq{font-family:var(--font-mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:10px 14px;overflow-x:auto;white-space:pre;font-size:.86rem}
.lesson code:not(pre code){font-family:var(--font-mono);font-size:.86em;background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:4px}
.callout{border-radius:6px;padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--bg)}
.callout > b:first-child{font-size:.78rem;font-family:var(--font-mono);letter-spacing:.04em}
.callout.term{border-left:4px solid var(--sea)}
.callout.term > b:first-child{color:var(--sea)}
.callout.predict{border-left:4px solid var(--buoy)}
.callout.predict > b:first-child{color:var(--buoy)}
.callout.trap{border-left:4px solid var(--miss)}
.callout.trap > b:first-child{color:var(--miss)}
.callout.job{border-left:4px solid var(--kelp)}
.callout.job > b:first-child{color:var(--kelp)}
.day-mark{font-family:var(--font-mono);font-size:.72rem;color:var(--paper);background:var(--sea);border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:2px}

/* code */
.code{position:relative;min-width:0}
.code pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:14px 16px;overflow-x:auto;font-size:.82rem;line-height:1.6}
.code pre code{font-family:var(--font-mono);background:none;padding:0}
.code .file{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-bottom:4px;display:block}
.code .cp{position:absolute;top:26px;right:8px;font-size:.7rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--muted)}
.code .cp:hover{color:var(--sea);border-color:var(--sea)}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--tok-kw)}
.hljs-string{color:var(--tok-str)}
.hljs-number{color:var(--tok-num)}
.hljs-comment{color:var(--tok-com);font-style:italic}
.hljs-title,.hljs-title.function_{color:var(--tok-fn)}
.hljs-meta,.hljs-attr{color:var(--tok-fn)}

/* animations */
.anim{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:14px;display:grid;gap:10px;min-width:0}
.anim .a-title{font-weight:700;font-size:.92rem}
.anim .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.84rem}
.anim .ctl label{display:inline-flex;gap:6px;align-items:center}
.anim input[type=range]{accent-color:var(--sea);width:160px;max-width:100%}
.anim input[type=checkbox]{accent-color:var(--sea)}
.anim .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.anim .seg button{border:0;background:var(--paper);padding:4px 10px;cursor:pointer;font-size:.8rem}
.anim .seg button[aria-pressed="true"]{background:var(--sea);color:var(--paper)}
.anim .read{font-size:.84rem;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 18px}
.anim .read .bad{color:var(--miss)}
.anim .read .good{color:var(--kelp)}
.anim .cap{font-size:.84rem;color:var(--muted)}
.anim .plots{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.anim .plots > div{flex:1 1 300px;min-width:0}
.anim .plots > .phasor{flex:0 0 170px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.job{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--font-mono);font-size:.72rem;display:grid;gap:2px;transition:background .25s,border-color .25s}
.job .st{font-size:.68rem;color:var(--muted)}
.job.run{border-color:var(--buoy);background:var(--buoy-soft)}
.job.ok{border-color:var(--kelp);background:var(--kelp-soft)}
.job.skip{border-style:dashed;opacity:.65}
.job.fail{border-color:var(--miss);background:var(--miss-soft)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe .stage{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:4px;align-content:start;min-width:0;transition:opacity .3s,border-color .3s}
.pipe .stage.dim{opacity:.3}
.pipe .stage.on{border-color:var(--sea)}
.pipe .cmd{font-family:var(--font-mono);font-size:.72rem;color:var(--sea);overflow-wrap:anywhere}
.pipe .ln{font-family:var(--font-mono);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.pipe{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* notes */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.notes{grid-template-columns:1fr}}
.notes label{display:grid;gap:6px;font-size:.84rem;font-weight:500}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:10px;line-height:1.6}
@media (prefers-reduced-motion:no-preference){.map .fill{transition:height .3s ease}}
.sources summary{cursor:pointer;list-style-position:outside}
.sources[open] summary{margin-bottom:4px}
.src-list{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.84rem;list-style:none}
.src-list li{overflow-wrap:anywhere}
.src-list .src-ph{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.mod{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:4px;align-content:start;min-width:0;background:var(--paper)}
.mod .pill{font-size:.68rem;font-family:var(--font-mono);padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.mod.audit{border-color:var(--buoy)}.mod.audit .pill{background:var(--buoy-soft);color:var(--buoy)}
.mod.swap{border-color:var(--kelp)}.mod.swap .pill{background:var(--kelp-soft);color:var(--kelp)}
.audit{border-left:4px solid var(--buoy)}
.bigq{border:1px solid var(--buoy);background:var(--buoy-soft);border-radius:8px;padding:10px 14px;display:grid;gap:2px;max-width:70ch}
.bigq b{font-family:var(--font-display);font-size:1.12rem;line-height:1.5}
.minimap summary{cursor:pointer}
.minimap[open] summary{margin-bottom:8px}
.bm{display:grid;gap:8px;min-width:0}
.bm-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.bm-arrow{color:var(--muted);align-self:center;font-size:.9rem}
.bm-box{position:relative;display:grid;gap:1px;align-content:start;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:96px;flex:1 1 96px}
.bm-box b{font-size:.86rem}
.bm-box span{font-size:.7rem;color:var(--muted)}
.bm-box .bm-w{font-size:.62rem}
.bm-box:hover{border-color:var(--sea)}
.bm-box.some{background:var(--kelp-soft)}
.bm-box.here{border:2px solid var(--buoy);background:var(--buoy-soft)}
.bm-here{position:absolute;top:-8px;right:6px;font-size:.6rem!important;font-family:var(--font-mono);background:var(--buoy);color:var(--paper)!important;border-radius:3px;padding:0 5px}
.bm-band{position:relative;border:1px dashed var(--miss);border-radius:6px;padding:6px 10px;font-size:.8rem;color:var(--ink)}
.bm-band b{color:var(--miss);margin-right:8px}
.bm-band.here{border-style:solid;border-width:2px;background:var(--miss-soft)}
.stage-no{display:inline-grid;place-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.8em;margin-right:8px;vertical-align:2px}
.lesson .lead{color:var(--muted)}
.lesson [data-day]{scroll-margin-top:96px}
.lesson h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px}
.callout.demo{border-left:4px solid var(--kelp);background:var(--kelp-soft)}
.callout.demo > b:first-child{color:var(--kelp)}
details.hint{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg)}
details.hint summary{cursor:pointer;font-size:.86rem;color:var(--sea);font-weight:500}
details.hint[open] summary{margin-bottom:6px}
details.hint p{margin:0}
.bigq-intro{gap:10px}
/* 單元連動圖 */
.dep,.sources{display:block}
.dep summary,.sources summary{cursor:pointer}
.dep-body{display:grid;gap:12px;min-width:0;margin-top:12px}
.dep-body > *{min-width:0}
.dep-wrap{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.dep-svg{display:block;min-width:960px;width:100%;height:auto}
.dep-edge{fill:none;stroke-width:1.8;opacity:.75;transition:opacity .2s,stroke-width .2s}
.dep-svg.focus .dep-edge{opacity:.1}
.dep-svg.focus .dep-edge.on{opacity:1;stroke-width:3}
.dep-node{cursor:pointer}
.dep-node circle{stroke-width:2;transition:opacity .2s}
.dep-node text{font-family:var(--font-mono);font-size:10px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dep-node.cat-start circle{fill:var(--paper);stroke:var(--sea)}
.dep-node.cat-start text{fill:var(--sea)}
.dep-node.cat-linked circle{fill:var(--sea);stroke:var(--sea)}
