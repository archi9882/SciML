apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidewatch-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tidewatch-api
  template:
    metadata:
      labels:
        app: tidewatch-api
    spec:
      containers:
        - name: api
          image: tidewatch:latest
          ports:
            - containerPort: 8000
          env:
            - name: TIDEWATCH_API_KEY
              value: sk-demo-7f3a9c
---
apiVersion: v1
kind: Service
metadata:
  name: tidewatch-api
spec:
  selector:
    app: tidewatch-api
  ports:
    - port: 80
      targetPort: 8000
