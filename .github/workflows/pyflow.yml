# Test the pyflow analyzer on every change, and publish the web demo to
# GitHub Pages when main is updated.
name: pyflow

on:
  push:
    branches: [main]
    paths: ["pyflow/**", ".github/workflows/pyflow.yml"]
  pull_request:
    paths: ["pyflow/**", ".github/workflows/pyflow.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyflow
    strategy:
      matrix:
        # 3.12 matches the Python inside Pyodide 0.26; 3.13 is the latest release.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q

  deploy:
    # Only publish from main, after the tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pyflow/scripts/build_site.py pyflow/_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pyflow/_site
      - id: deployment
        uses: actions/deploy-pages@v4
